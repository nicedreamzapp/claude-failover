<svg xmlns="http://www.w3.org/2000/svg" width="820" height="109" viewBox="0 0 820 109" role="img" aria-label="flag = claude. Runs the real claude -p. flag = local. POSTs to the local MLX server. Lazy-load. The model loads only when you flip to local."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="219.1" height="109" rx="10"/></clipPath><rect width="219.1" height="109" rx="10" fill="url(#n)"/><rect width="219.1" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="218.1" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="112" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">🟢 flag = claude</text><text x="112" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Runs the real claude</text><text x="112" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">-p.</text></g><g transform="translate(231.1,0)"><clipPath id="c0_1"><rect width="262.1" height="109" rx="10"/></clipPath><rect width="262.1" height="109" rx="10" fill="url(#n)"/><rect width="262.1" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="261.1" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="133" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">💻 flag = local</text><text x="133" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">POSTs to the local MLX</text><text x="133" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">server.</text></g><g transform="translate(505.2,0)"><clipPath id="c0_2"><rect width="314.8" height="109" rx="10"/></clipPath><rect width="314.8" height="109" rx="10" fill="url(#n)"/><rect width="314.8" height="4" fill="#8a4f68" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="313.8" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="159" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">💤 Lazy-load</text><text x="159" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">The model loads only when you flip</text><text x="159" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">to local.</text></g></g></svg>
